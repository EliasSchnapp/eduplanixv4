<!DOCTYPE html>
<html>
<head>
  <title>Create Icons</title>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Background gradient
    const gradient = ctx.createLinearGradient(0, 0, 512, 512);
    gradient.addColorStop(0, '#0f172a');
    gradient.addColorStop(0.5, '#1e293b');
    gradient.addColorStop(1, '#0f172a');
    
    // Draw background with rounded corners
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 64);
    ctx.fill();
    
    // Draw letter "E" in cyan
    ctx.fillStyle = '#67e8f9';
    ctx.font = 'bold 200px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('E', 256, 256);
    
    // Draw "EduPlanix" text
    ctx.fillStyle = '#67e8f9';
    ctx.font = 'bold 32px Arial';
    ctx.fillText('EduPlanix', 256, 420);
    
    // Convert to different sizes and download
    function downloadIcon(size, name) {
      const smallCanvas = document.createElement('canvas');
      smallCanvas.width = size;
      smallCanvas.height = size;
      const smallCtx = smallCanvas.getContext('2d');
      smallCtx.drawImage(canvas, 0, 0, size, size);
      
      const link = document.createElement('a');
      link.download = name;
      link.href = smallCanvas.toDataURL('image/png');
      link.click();
    }
    
    // Create icons
    setTimeout(() => {
      downloadIcon(512, 'icon-512x512.png');
      downloadIcon(192, 'icon-192x192.png');
      downloadIcon(180, 'apple-touch-icon.png');
      downloadIcon(32, 'favicon-32x32.png');
      downloadIcon(16, 'favicon-16x16.png');
    }, 1000);
  </script>
</body>
</html>
